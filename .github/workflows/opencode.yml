name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure git author
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
      - name: Configure git credentials
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.OPENCODE_REPO_TOKEN }}@github.com" > ~/.git-credentials
      - name: Sync with remote before push
        run: git pull --rebase origin ${{ github.head_ref }}
      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OPENCODE_REPO_TOKEN }}
        with:
          model: opencode/deepseek-v4-pro
          use_github_token: true
          prompt: |
            Then create comment follow the Commit Message Format in DEVELOPMENTS.md 
