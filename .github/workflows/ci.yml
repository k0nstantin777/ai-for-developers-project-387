name: CI

on:
  push:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_TARGET: backend

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/api/event-types > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          docker compose logs backend
          exit 1

      - name: PHPUnit tests
        run: docker compose exec -T backend php artisan test

      - name: Backend lint
        run: docker compose exec -T backend ./vendor/bin/pint --test

      - name: Frontend lint
        run: docker compose exec -T frontend npm run lint

      - name: E2E tests
        run: docker compose --profile e2e up --build --abort-on-container-exit e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report/

      - name: Cleanup
        if: always()
        run: docker compose --profile e2e down -v
