services:
  nginx:
    build:
      context: ./docker/nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  backend:
    build:
      context: ./docker/backend
    volumes:
      - ./src/backend:/app
      - backend-vendor:/app/vendor
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/app/database/database.sqlite
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "php", "artisan", "inspire"]
      interval: 3s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./docker/frontend
    volumes:
      - ./src/frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=${VITE_API_TARGET:-prism}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 3s
      timeout: 3s
      retries: 10

  prism:
    image: stoplight/prism:4
    volumes:
      - ./specs:/specs
    ports:
      - "4010:4010"
    profiles:
      - mock
    networks:
      - app-network
    command: mock -h 0.0.0.0 /specs/openapi.yaml

  e2e:
    build:
      context: ./docker/e2e
    volumes:
      - ./src/frontend/e2e:/app/e2e:ro
      - ./src/frontend/playwright.config.js:/app/playwright.config.js:ro
      - ./src/frontend/playwright-report:/app/playwright-report
    environment:
      - PLAYWRIGHT_BASE_URL=http://frontend:5173
      - BACKEND_URL=http://backend:8000
      - CI=true
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - e2e

volumes:
  backend-vendor:
  frontend-node-modules:

networks:
  app-network:
    driver: bridge
