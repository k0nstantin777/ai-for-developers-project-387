services:
  - type: web
    name: call-me-in-time
    runtime: docker
    dockerfilePath: ./render/backend.Dockerfile
    plan: free
    healthCheckPath: /api/event-types
    envVars:
      - key: APP_NAME
        value: "Call me in time"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        fromService:
          name: call-me-in-time
          type: web
          property: url
      - key: TRUSTED_PROXIES
        value: "*"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_TIMEZONE
        value: UTC
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
    disk:
      name: sqlite-data
      mountPath: /app/database
      sizeGB: 1
